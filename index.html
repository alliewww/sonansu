<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>そう...ソーナンス！</title>
  <style>
    :root {
      --bg: #2a1018;
      --card: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f4f4fb;
      --muted: #a9a9c8;
      --good: #2ecc71;
      --bad: #ff5c6c;
      --gold: #ffd166;
      --counter: #ff8a3d;
      --mirror: #7fb8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.05rem;
      margin: 0;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .rocket {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #c9184a;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: .95rem;
      flex: none;
    }

    .stats {
      display: flex;
      gap: 6px;
    }

    .stat {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }

    .stat b {
      font-size: .95rem;
    }

    .stat span {
      font-size: .7rem;
      color: var(--muted);
    }

    .stat.time b {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      min-width: 2.4em;
      text-align: right;
    }

    .stat.time.low {
      border-color: var(--bad);
      animation: pulse 1s ease-in-out infinite;
    }

    .stat.time.low b {
      color: var(--bad);
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 3px rgba(255, 92, 108, .3);
      }
    }

    .penalty {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      color: var(--bad);
      font-weight: 900;
      font-size: .9rem;
      white-space: nowrap;
      pointer-events: none;
      animation: penalty 1.1s ease-out forwards;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .5);
    }

    @keyframes penalty {
      0% {
        opacity: 0;
        transform: translate(-50%, -6px);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 14px);
      }
    }

    .timebar {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      margin: 0 0 10px;
    }

    .timebar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #ffd166, #ff9f43);
      transform-origin: left;
    }

    .timebar.low i {
      background: var(--bad);
    }

    .timebar.paused i {
      opacity: .5;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
    }

    .scene {
      --sh: clamp(250px, 40dvh, 360px);
      position: relative;
      height: var(--sh);
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(140, 200, 255, .22) 0%, rgba(140, 200, 255, .06) 50%, rgba(120, 210, 130, .16) 100%);
    }

    .side {
      position: absolute;
      width: calc(var(--sh) * .46);
      height: calc(var(--sh) * .46);
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }

    .side.foe {
      right: 5%;
      top: 7%;
    }

    .side.me {
      left: 3%;
      bottom: 3%;
      width: calc(var(--sh) * .52);
      height: calc(var(--sh) * .52);
    }

    .plat {
      position: absolute;
      left: -12%;
      width: 124%;
      bottom: 0;
      height: 26%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #9be07f 0%, #6cbf5a 45%, #3f8a3a 75%, #2e6a2c 100%);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), 0 8px 18px rgba(0, 0, 0, .3);
    }

    .side img {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10%;
      margin: auto;
      width: 100%;
      height: 92%;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .4));
      border: 0;
      outline: 0;
    }

    /* Browsers draw a placeholder border for an <img> with no src, still loading, or broken; keep it invisible until a real image has loaded. */
    .side img:not(.loaded) {
      visibility: hidden;
    }

    .side.me img {
      transform: scaleX(-1);
    }

    .info {
      position: absolute;
      z-index: 2;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(14, 12, 36, .62);
      border: 1px solid var(--border);
      max-width: 46%;
      transition: opacity .3s, transform .3s;
    }

    .info.foe-info {
      top: 10px;
      left: 10px;
    }

    .info.me-info {
      right: 10px;
      bottom: 12px;
      text-align: right;
    }

    .mon-name {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .mon-sub {
      color: var(--muted);
      font-size: .68rem;
    }

    .types {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .me-info .types {
      justify-content: flex-end;
    }

    .type {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: .74rem;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18);
    }

    .orb {
      position: absolute;
      z-index: 3;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 18px 6px rgba(255, 255, 255, .55), inset 0 0 8px rgba(255, 255, 255, .8);
    }

    .orb.counter {
      background: radial-gradient(circle, #fff 0 20%, var(--counter) 55%, #c2410c);
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      box-shadow: 0 0 26px 10px rgba(255, 138, 61, .7);
    }

    .orb.mirror {
      background: conic-gradient(from 0deg, #ff7aa2, #ffd166, #7cf2b0, #7fb8ff, #c58bff, #ff7aa2);
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      box-shadow: 0 0 26px 10px rgba(127, 184, 255, .7);
    }

    .dialog {
      position: relative;
      margin: 10px auto 0;
      background: #fbfbff;
      color: #22223a;
      border: 4px solid #4a4f86;
      border-radius: 12px;
      box-shadow: inset 0 0 0 3px #c9cdf2, 0 6px 16px rgba(0, 0, 0, .3);
      padding: 8px 30px 8px 14px;
      min-height: 62px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: .5px;
      line-height: 1.45;
      transition: opacity .2s;
    }

    .dialog .ask {
      display: block;
      font-size: .86rem;
      font-weight: 700;
      color: #c9184a;
      letter-spacing: 0;
      opacity: 0;
      transition: opacity .2s;
    }

    .dialog.done .ask {
      opacity: 1;
    }

    .dialog .mv {
      color: #c9184a;
    }

    .dialog .caret {
      position: absolute;
      right: 12px;
      bottom: 6px;
      font-style: normal;
      font-size: .7rem;
      color: #e64a4a;
      opacity: 0;
    }

    .dialog.done .caret {
      opacity: 1;
      animation: bob .8s ease-in-out infinite;
    }

    @keyframes bob {
      50% {
        transform: translateY(3px);
      }
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .choice {
      border: none;
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      color: #fff;
      font: inherit;
      text-align: left;
      position: relative;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25), inset 0 -3px 0 rgba(0, 0, 0, .2);
      transition: transform .12s, opacity .25s, box-shadow .2s;
    }

    .choice:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .choice:disabled {
      cursor: default;
    }

    .choice .cname {
      font-size: 1.15rem;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }

    .choice .cdesc {
      font-size: .75rem;
      margin-top: 4px;
      opacity: .95;
    }

    .choice .key {
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: .7rem;
      font-weight: 800;
      background: rgba(0, 0, 0, .25);
      border-radius: 6px;
      padding: 1px 6px;
    }

    .choice.counter {
      background: linear-gradient(135deg, #ff9f43, #e8590c);
    }

    .choice.mirror {
      background: linear-gradient(135deg, #74b9ff, #6c5ce7);
    }

    .choice.correct {
      outline: 3px solid var(--good);
      outline-offset: 2px;
    }

    .choice.wrong {
      outline: 3px solid var(--bad);
      outline-offset: 2px;
    }

    .revealed .choice:not(.correct):not(.wrong) {
      opacity: .5;
    }

    .note {
      margin: 10px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
    }

    .legal {
      margin: 10px 0 0;
      font-size: .65rem;
      color: var(--muted);
      line-height: 1.45;
      font-weight: 500;
    }

    .enc .side.foe {
      transform: translateX(130%);
    }

    .enc .foe-info {
      opacity: 0;
      transform: translateY(-6px);
    }

    .enc:not(.s-dialog) .dialog {
      opacity: 0;
    }

    .wait .choice {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    .wait .choice:nth-child(2) {
      transition-delay: .06s;
    }

    .no-trans,
    .no-trans * {
      transition: none !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(8, 8, 22, .6);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility 0s .2s;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
      transition: opacity .2s;
    }

    .sheet {
      position: relative;
      width: min(400px, 100%);
      text-align: center;
      background: #2e1a24;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 38px 16px 16px;
      margin-top: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
      transform: translateY(24px) scale(.96);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1);
    }

    .modal.show .sheet {
      transform: none;
    }

    .modal.cover {
      padding: 0;
      background: var(--bg);
      place-items: stretch;
    }

    .modal.cover .sheet {
      width: 100%;
      max-width: none;
      min-height: 100%;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: var(--bg);
      box-shadow: none;
      transform: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: stretch;
      align-items: stretch;
      position: relative;
    }

    .modal.cover .mark {
      position: static;
      margin: 0 auto 14px;
      border-color: var(--bg);
    }

    .modal.cover .sheet-title {
      font-size: 1.7rem;
    }

    .modal.cover .rules,
    .modal.cover .record,
    .modal.cover .next {
      width: min(400px, 100%);
    }

    .cover-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 22px 16px;
      width: 100%;
    }

    .cover-foot {
      width: 100%;
      padding: 12px 22px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255, 255, 255, .08);
      text-align: center;
    }

    .cover-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px 0;
      font-size: .75rem;
    }

    .cover-links button {
      background: none;
      border: 0;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 10px;
    }

    .cover-links button:hover {
      color: var(--text);
    }

    .cover-links span {
      color: rgba(255, 255, 255, .2);
    }

    .cover-copy {
      margin: 6px 0 0;
      font-size: .62rem;
      color: rgba(255, 255, 255, .38);
    }

    .ver {
      position: absolute;
      top: 10px;
      right: 14px;
      z-index: 3;
      font-size: .62rem;
      font-weight: 600;
      color: rgba(255, 255, 255, .34);
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .legal-panel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--bg);
      padding: 0;
      overflow: auto;
      text-align: left;
    }

    .legal-panel.open {
      display: flex;
      flex-direction: column;
    }

    .legal-bar {
      flex: none;
      display: flex;
      align-items: center;
      padding: 10px 8px 10px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: var(--bg);
    }

    .legal-back {
      background: none;
      border: 0;
      color: var(--muted);
      font: inherit;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 12px;
    }

    .legal-back:hover {
      color: var(--text);
    }

    .legal-panel h3 {
      margin: 4px 0 4px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: .04em;
    }

    .legal-meta {
      text-align: center;
      color: rgba(255, 255, 255, .38);
      font-size: .7rem;
      margin: 0 0 16px;
    }

    .legal-panel h4 {
      margin: 14px 0 6px;
      font-size: .86rem;
      color: var(--text);
      font-weight: 800;
    }

    .legal-panel p,
    .legal-panel li {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.7;
      font-weight: 500;
    }

    .legal-panel p {
      margin: 0 0 8px;
    }

    .legal-panel ul {
      margin: 0 0 10px;
      padding-left: 1.15em;
    }

    .legal-panel a {
      color: #ffb4c4;
    }

    .legal-inner {
      flex: 1;
      overflow: auto;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 22px calc(20px + env(safe-area-inset-bottom));
    }

    .mark {
      position: absolute;
      top: -28px;
      left: 0;
      right: 0;
      margin: auto;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      font-weight: 900;
      color: #fff;
      border: 4px solid #2e1a24;
    }

    .good .mark {
      background: var(--good);
    }

    .bad .mark {
      background: var(--bad);
    }

    .neutral .mark {
      background: #c9184a;
      font-size: 1.4rem;
    }

    .verdict,
    .sheet-title {
      font-size: 1.35rem;
      font-weight: 900;
    }

    .good .verdict {
      color: var(--good);
    }

    .bad .verdict {
      color: var(--bad);
    }

    .penalty-note {
      color: var(--bad);
      font-size: .85rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .streak-note {
      color: var(--gold);
      font-size: .85rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .move-card {
      margin: 12px 0;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .06);
    }

    .move-card .mvname {
      font-size: 1.25rem;
      font-weight: 900;
      margin-top: 6px;
    }

    .move-card .meta {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 2px;
    }

    .cat {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 900;
      font-size: .9rem;
    }

    .cat.phys {
      background: rgba(255, 138, 61, .2);
      color: var(--counter);
      box-shadow: inset 0 0 0 2px var(--counter);
    }

    .cat.spec {
      background: rgba(127, 184, 255, .18);
      color: var(--mirror);
      box-shadow: inset 0 0 0 2px var(--mirror);
    }

    .explain {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .explain b {
      color: var(--text);
    }

    .rules {
      list-style: none;
      padding: 0;
      margin: 12px 0 14px;
      display: grid;
      gap: 6px;
      text-align: left;
      font-size: .88rem;
    }

    .rules li {
      background: rgba(255, 255, 255, .05);
      border-radius: 10px;
      padding: 8px 11px;
      line-height: 1.5;
    }

    .rules b {
      color: var(--gold);
    }

    .rules .c {
      color: var(--counter);
    }

    .rules .m {
      color: var(--mirror);
    }

    .big-score {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin-top: 8px;
    }

    .big-score small {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 700;
      margin-left: 4px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 14px 0;
    }

    .summary div {
      background: rgba(255, 255, 255, .05);
      border-radius: 10px;
      padding: 8px 4px;
    }

    .summary b {
      display: block;
      font-size: 1.1rem;
    }

    .summary span {
      font-size: .72rem;
      color: var(--muted);
    }

    .record {
      font-weight: 800;
      color: var(--muted);
      font-size: .9rem;
    }

    .record.new {
      color: var(--gold);
    }

    .next {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 11px 26px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #ffd166, #ff9f43);
      color: #3b2300;
      box-shadow: 0 6px 16px rgba(255, 159, 67, .35);
    }

    .next:hover {
      filter: brightness(1.08);
    }

    .t-normal {
      background: #9fa19f
    }

    .t-fire {
      background: #e62829
    }

    .t-water {
      background: #2980ef
    }

    .t-electric {
      background: #e6b800
    }

    .t-grass {
      background: #3fa129
    }

    .t-ice {
      background: #3dcef3
    }

    .t-fighting {
      background: #ff8000
    }

    .t-poison {
      background: #9141cb
    }

    .t-ground {
      background: #915121
    }

    .t-flying {
      background: #81b9ef
    }

    .t-psychic {
      background: #ef4179
    }

    .t-bug {
      background: #91a119
    }

    .t-rock {
      background: #afa981
    }

    .t-ghost {
      background: #704170
    }

    .t-dragon {
      background: #5060e1
    }

    .t-dark {
      background: #50413f
    }

    .t-steel {
      background: #60a1b8
    }

    .t-fairy {
      background: #ef70ef
    }

    @media (max-width: 460px) {
      .stats {
        gap: 4px;
      }

      .stat {
        padding: 4px 7px;
        gap: 3px;
      }

      h1 {
        gap: 5px;
        font-size: .9rem;
        letter-spacing: 0;
      }

      .scene {
        --sh: clamp(230px, 40dvh, 340px);
      }

      .choice .cname {
        font-size: 1.05rem;
      }
    }

    @media (max-width: 400px) {
      h1 {
        font-size: .84rem;
      }
    }

    @media (max-width: 388px) {
      .stat.tally>span {
        display: none;
      }
    }

    @media (max-width: 362px) {
      .stat.best {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .side,
      .info,
      .choice,
      .sheet {
        transition: opacity .2s ease !important;
        transform: none !important;
      }

      .side.me img {
        transform: scaleX(-1) !important;
      }

      normal: "一般", fire: "火", water: "水", electric: "電", grass: "草", ice: "冰",
      fighting: "格鬥", poison: "毒", ground: "地面", flying: "飛行", psychic: "超能力", bug: "蟲",
      rock: "岩石", ghost: "幽靈", dragon: "龍", dark: "惡", steel: "鋼", fairy: "妖精"
    };
    const CATS = ["物理", "特殊"];

    const TIME_LIMIT = 60;
    const PENALTY = 10;
    const VERSION = "26.1105.21";
    const MOVES = window.MOVES.map(([name, type, cat, power]) => ({ name, type, cat, power }));
    const MONS = window.MONS.map(([id, name, types, moves]) => ({ id, name, types, moves }));

    const $ = id => document.getElementById(id);
    const rand = arr => arr[Math.floor(Math.random() * arr.length)];
    const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
    const spriteUrl = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#222" stroke-width="5"/><path d="M6 50a44 44 0 0 1 88 0z" fill="#ff4d4d" stroke="#222" stroke-width="5"/><circle cx="50" cy="50" r="13" fill="#fff" stroke="#222" stroke-width="5"/></svg>`);

    const state = {
      phase: "idle", score: 0, rounds: 0, streak: 0, maxStreak: 0, timeLeft: TIME_LIMIT, timerRunning: false,
      best: +(localStorage.getItem("wob-best") || 0), round: null, answered: false, animating: false, modalKind: null
    };

    /* Round generation: pick a random opponent, then physical or special with equal chance
       (if the opponent can learn that category), then a random damaging move of that category it can learn. */
    function generateRound(lastId) {
      for (; ;) {
        const mon = rand(MONS);
        if (mon.id === lastId) continue;
        const byCat = [0, 1].map(c => mon.moves.filter(i => MOVES[i].cat === c));
        const cats = [0, 1].filter(c => byCat[c].length);
        const cat = rand(cats);
        return { mon, move: MOVES[rand(byCat[cat])] };
      }
    }

    const upcoming = [];
    const preloaded = [];
    function fillUpcoming() {
      while (upcoming.length < 3) {
        const round = generateRound((upcoming.at(-1) || state.round)?.mon.id);
        const im = new Image();
        im.src = spriteUrl(round.mon.id);
        preloaded.push(im);
        if (preloaded.length > 8) preloaded.shift();
        upcoming.push(round);
      }
    }
    function takeRound() {
      fillUpcoming();
      const round = upcoming.shift();
      fillUpcoming();
      return round;
    }

    function setSprite(img, url) {
      img.classList.remove("loaded");
      img.onload = () => { if (img.naturalWidth) img.classList.add("loaded"); };
      img.onerror = () => { img.onerror = null; img.src = FALLBACK; };
      img.src = url;
      if (img.complete && img.naturalWidth) img.classList.add("loaded");
    }
    function spriteReady(img, ms) {
      return new Promise(r => {
        if (img.classList.contains("loaded")) return r();
        const t = setTimeout(r, ms);
        img.addEventListener("load", () => { clearTimeout(t); r(); }, { once: true });
      });
    }

    function renderStats() {
      $("score").textContent = state.score; $("rounds").textContent = state.rounds; $("best").textContent = state.best;
      renderTime();
    }
    function renderTime() {
      const low = state.phase === "playing" && state.timeLeft <= 10;
      $("time").textContent = state.timeLeft.toFixed(1);
      $("timeStat").classList.toggle("low", low);
      $("timebar").classList.toggle("low", low);
      $("timebar").classList.toggle("paused", state.phase === "playing" && !state.timerRunning);
      $("timeFill").style.transform = `scaleX(${state.timeLeft / TIME_LIMIT})`;
    }
    let lastTick = performance.now();
    let catchUp = false;
    let windowBlurred = false;
    let bgClock = 0;

      return document.hidden || windowBlurred;
    }

      let elapsed = now - lastTick;

      // stops rAF, so that gap is real time — including the frame after you return.
      const away = pageAway();
      if (!away && !catchUp && elapsed > 250) elapsed = 250;
      if (!away) catchUp = false;
      lastTick = now;
      const dt = Math.max(0, elapsed) / 1000;
      if (dt > 0 && state.phase === "playing" && state.timerRunning) {

        state.streak = 0;
        state.timeLeft = Math.max(0, state.timeLeft - PENALTY);
        $("timeStat").insertAdjacentHTML("beforeend", `<span class="penalty">−${PENALTY} 秒</span>`);
        setTimeout(() => $("timeStat").querySelector(".penalty")?.remove(), 1200);
      }
      renderStats();
      $("game").classList.add("revealed");
      document.querySelectorAll(".choice").forEach((b, j) => {
        b.disabled = true;
        if (j === move.cat) b.classList.add("correct");
        else if (j === c) b.classList.add("wrong");
      });
      const mv = `<span class="mv">${move.name}</span>`;
      const finalText = ok
        ? `果然翁使出了「${REFLECT[c]}」！加倍奉還給${mon.name}！`
        : `果然翁使出了「${REFLECT[c]}」…但是失敗了！`;
      const e = enc = { done: false, skipped: false, cancelled: false, wake: null };
      const sleep = sleeper(e);
      const orbs = [];
      state.animating = true;
      (async () => {
        if (!reduceMotion()) {
          if (!await sleep(300)) return;
          $("dialog").classList.remove("done");
          $("dialogText").innerHTML = `對手的${mon.name}使出了「${mv}」！`;
          orbs.push(fly("t-" + move.type, $("foe"), $("me"), 280));
          if (!await sleep(280)) return;
          shake($("me"), ok ? "#fff" : "#ff5c6c");
          if (!await sleep(200)) return;
          $("dialogText").textContent = `果然翁使出了「${REFLECT[c]}」！`;
          if (!await sleep(150)) return;
          if (ok) {
            orbs.push(fly(c ? "mirror" : "counter", $("me"), $("foe"), 260));
            if (!await sleep(260)) return;
            shake($("foe"), c ? "#7fb8ff" : "#ff8a3d");
          }
          $("dialogText").textContent = finalText;
          await sleep(250);
        }
      })().then(() => {
        if (e.cancelled) return;
        orbs.forEach(o => o.anim.cancel());
        $("dialog").classList.remove("done");
        $("dialogText").textContent = finalText;
        e.done = true;
        state.animating = false;
        if (state.timeLeft === 0) return timeUp();
        showAnswer(ok, c, mon, move);
      });
    }

    function showAnswer(ok, c, mon, move) {
      showModal("answer", ok ? "good" : "bad", `
    <div class="mark">${ok ? "✓" : "✕"}</div>
    <div class="verdict" id="verdict">${ok ? "反擊成功！" : "反擊失敗！"}</div>
    ${ok && state.streak >= 2 ? `<div class="streak-note">🔥 ${state.streak} 連勝中</div>` : ""}
    ${ok ? "" : `<div class="penalty-note">⏱ −${PENALTY} 秒</div>`}
    <div class="move-card">
      <span class="type t-${move.type}">${TYPES[move.type]}</span>
      <div class="mvname">${move.name}</div>
      <div class="meta">${mon.name} 的招式${move.power ? `・威力 ${move.power}` : ""}</div>
      <span class="cat ${move.cat ? "spec" : "phys"}">${CATS[move.cat]}招式</span>
    </div>
    <div class="explain">${CATS[move.cat]}招式要用 <b>${REFLECT[move.cat]}</b> 反彈${ok ? "" : `，${REFLECT[c]}只能反彈${CATS[c]}招式`}</div>
    <button class="next" id="nextBtn">下一題 →</button>`, "nextBtn", nextQuestion, 150);
    }

    function nextQuestion() { if (state.phase === "playing" && state.answered && !state.animating) newRound(); }

    function timeUp() {
      state.timerRunning = false;
      state.phase = "over";
      state.answered = true;
      $("game").classList.add("revealed");
      document.querySelectorAll(".choice").forEach((b, j) => {
        b.disabled = true;
        if (j === state.round.move.cat) b.classList.add("correct");
      });
      $("dialog").classList.remove("done");
      $("dialogText").textContent = "時間到！";
      const newRecord = state.score > state.best;
      if (newRecord) { state.best = state.score; localStorage.setItem("wob-best", state.best); }
      renderStats();
      const acc = state.rounds ? Math.round(state.score / state.rounds * 100) : 0;
      showModal("result", "neutral", `
    <div class="mark">🏁</div>
    <div class="sheet-title" id="verdict">時間到！</div>
    <div class="big-score">${state.score}<small>次反擊成功</small></div>
    <div class="summary">
      <div><b>${state.rounds}</b><span>作答題數</span></div>
      <div><b>${acc}%</b><span>正確率</span></div>
      <div><b>${state.maxStreak}</b><span>最長連勝</span></div>
    </div>
    <div class="record ${newRecord ? "new" : ""}">${newRecord ? "🎉 新紀錄！" : `最高紀錄：${state.best} 題`}</div>
    <button class="next" id="startBtn" style="margin-top:12px">再玩一次</button>`, "startBtn", startGame, 700);
    }

    document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); choose(+b.dataset.c); }));
    document.addEventListener("keydown", e => {
      if (state.animating) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); skipEncounter(); }
        return;
      }
      if (e.key === "Escape" && coverPanelOpen()) { e.preventDefault(); closeCoverPanels(); return; }
      const confirm = e.key === "Enter" || e.key === " ";
      if (confirm && coverPanelOpen()) return;
      if (confirm && (state.modalKind === "start" || state.modalKind === "result")) { e.preventDefault(); startGame(); }
      else if (e.key === "1" || e.key === "2") choose(+e.key - 1);
      else if (confirm && state.answered) { e.preventDefault(); nextQuestion(); }
    });
    document.addEventListener("click", () => { if (state.animating) skipEncounter(); });

    setSprite($("meImg"), spriteUrl(202));
    fillUpcoming();
    window.__wob = { MOVES, MONS, state, generateRound, newRound, choose, startGame, timeUp };
    renderStats();
    requestAnimationFrame(tick);
    showStart();
  </script>
</body>

</html>
